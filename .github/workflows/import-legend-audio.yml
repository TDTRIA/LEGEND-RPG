name: Import generated LEGEND audio assets

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'audio/import-manifest.json'

permissions:
  contents: write

jobs:
  import-audio:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'audio/legend-world-audio-pass'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the authorized audio branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download and validate generated MP3s
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          manifest = json.loads(pathlib.Path("audio/import-manifest.json").read_text(encoding="utf-8"))
          files = manifest.get("files", [])
          if not files:
              raise SystemExit("Audio manifest contains no files.")

          for item in files:
              url = item["url"]
              path = pathlib.PurePosixPath(item["path"])
              parsed = urllib.parse.urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "mirelo.ai" or not parsed.path.startswith("/dl/"):
                  raise SystemExit(f"Refusing untrusted asset URL: {url}")
              if not path.as_posix().startswith("assets/audio/") or ".." in path.parts:
                  raise SystemExit(f"Refusing output path: {path}")
              target = pathlib.Path(path.as_posix())
              target.parent.mkdir(parents=True, exist_ok=True)
              request = urllib.request.Request(url, headers={"User-Agent": "LEGEND-Audio-Asset-Importer/1.0"})
              with urllib.request.urlopen(request, timeout=120) as response, target.open("wb") as output:
                  first = response.read(3)
                  output.write(first)
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      output.write(chunk)
              size = target.stat().st_size
              header = target.read_bytes()[:3]
              if size < 4096 or not (header == b"ID3" or header[:2] in (b"\xff\xfb", b"\xff\xf3", b"\xff\xf2")):
                  target.unlink(missing_ok=True)
                  raise SystemExit(f"Downloaded file is not a valid MP3: {target} ({size} bytes)")
              print(f"Imported {target} ({size:,} bytes)")

          print(f"Imported {len(files)} audio assets.")
          PY

      - name: Commit audio assets to the PR branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio
          if git diff --cached --quiet; then
            echo "No audio assets changed."
            exit 0
          fi
          git commit -m "Add generated LEGEND audio asset library"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
