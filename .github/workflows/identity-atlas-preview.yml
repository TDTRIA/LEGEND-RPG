name: Preview Runway traveler identity atlas

on:
  push:
    branches:
      - asset-preview-runway-identity
    paths:
      - .github/workflows/identity-atlas-preview.yml

permissions:
  contents: read

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Download generated Runway sheet
        env:
          RUNWAY_ATLAS_URL: "https://dnznrvs05pmza.cloudfront.net/3afa3050-3bad-4492-ad0b-a073dbc8c8f0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGU3NDI2MjAyM2IzZWM0ZCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mzg1Mzk4NH0.GCcN2lAiiGzkfbtbZ-NCh0Ai8SWIsFMHvKski2OMxfg"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$RUNWAY_ATLAS_URL" --output /tmp/identity-atlas.png
          file /tmp/identity-atlas.png

      - name: Crop four square identity emblems for review
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import json

          source = Image.open('/tmp/identity-atlas.png').convert('RGBA')
          width, height = source.size
          cell_w, cell_h = width // 2, height // 2
          side = min(cell_w, cell_h)
          names = ['woman', 'man', 'nonbinary', 'unspoken']
          output = Path('/tmp/identity-preview')
          output.mkdir(parents=True, exist_ok=True)
          crops = []
          for index, name in enumerate(names):
              col, row = index % 2, index // 2
              left = col * cell_w + (cell_w - side) // 2
              top = row * cell_h + (cell_h - side) // 2
              crop = source.crop((left, top, left + side, top + side))
              crop.save(output / f'{name}.webp', 'WEBP', quality=92, method=6)
              crops.append((name, crop))
          canvas = Image.new('RGBA', (side * 2, side * 2), (18, 20, 17, 255))
          for index, (name, crop) in enumerate(crops):
              canvas.alpha_composite(crop, ((index % 2) * side, (index // 2) * side))
          canvas.save(output / 'contact-sheet.png')
          print(json.dumps({'atlas_size': source.size, 'cell_size': (cell_w, cell_h), 'crop_size': (side, side), 'files': [f'{n}.webp' for n in names]}))
          PY

      - name: Upload preview crops
        uses: actions/upload-artifact@v4
        with:
          name: runway-traveler-identity-preview
          path: /tmp/identity-preview/
          if-no-files-found: error
          retention-days: 2
