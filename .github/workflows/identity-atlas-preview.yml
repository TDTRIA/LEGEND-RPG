name: Preview Runway traveler identity emblems

on:
  push:
    branches:
      - asset-preview-runway-identity
    paths:
      - .github/workflows/identity-atlas-preview.yml

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Download four standalone Runway emblems
        env:
          WOMAN_URL: "https://dnznrvs05pmza.cloudfront.net/a8b51540-bea8-4702-b93e-7b3cd25e831a.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGE1ZjBkYjQyMTllMjg5MCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mzg3NzgxMn0.4NAkSScLHs1VJIznbXnnn7gAIJ4nWVbwWPDGm_U8D2Q"
          MAN_URL: "https://dnznrvs05pmza.cloudfront.net/5aa98b8e-a3c1-43fd-9f07-3369b0194b17.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzcxMThkZTc4ZWE3ZjQ5MiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mzg1ODkxOX0.IDywNsSPDgfK_EZZH3dNXBxMCJ8EYuL0ePkvf7GEEp0"
          NONBINARY_URL: "https://dnznrvs05pmza.cloudfront.net/57492754-60ec-4c0e-b2f3-9c49667646f8.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYmM1YjE0NGJkMDYzZWM5NSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mzg0MjM3OX0.7N9jG6gRCNrXzyVcTHAMYKhA_HB9GQ0EwOiR3bAvQyc"
          UNSPOKEN_URL: "https://dnznrvs05pmza.cloudfront.net/952b972b-9e0b-4d38-957a-0ebb926f8934.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYThiZDY3NzJlMWI4NzFmOSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzgzOTQ3NH0.C6zBCGkwrFO9J52u6BK-gSMEU1Kv3vxoHZMR0dE80Kk"
        run: |
          set -euo pipefail
          mkdir -p /tmp/identity-source
          curl --fail --location --silent --show-error "$WOMAN_URL" --output /tmp/identity-source/woman.png
          curl --fail --location --silent --show-error "$MAN_URL" --output /tmp/identity-source/man.png
          curl --fail --location --silent --show-error "$NONBINARY_URL" --output /tmp/identity-source/nonbinary.png
          curl --fail --location --silent --show-error "$UNSPOKEN_URL" --output /tmp/identity-source/unspoken.png
          file /tmp/identity-source/*.png

      - name: Crop and normalize final local game emblems
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import json

          source = Path('/tmp/identity-source')
          output = Path('/tmp/identity-preview')
          output.mkdir(parents=True, exist_ok=True)
          # Normalized crops reproduce the manually inspected face/bust crop.
          boxes = {
              'woman': (0.3046875, 0.23046875, 0.6953125, 0.62109375),
              'man': (0.3046875, 0.21875, 0.6953125, 0.609375),
              'nonbinary': (0.3046875, 0.25, 0.6953125, 0.640625),
              'unspoken': (0.3046875, 0.265625, 0.6953125, 0.65625),
          }
          names = ['woman', 'man', 'nonbinary', 'unspoken']
          assets = Path('assets/generated/ui/icons')
          assets.mkdir(parents=True, exist_ok=True)
          tile_size = 512
          gutter = 28
          contact = Image.new('RGBA', (tile_size * 2 + gutter * 3, tile_size * 2 + gutter * 3), (8, 11, 9, 255))
          for i, name in enumerate(names):
              image = Image.open(source / f'{name}.png').convert('RGB')
              width, height = image.size
              x1, y1, x2, y2 = boxes[name]
              box = (round(width*x1), round(height*y1), round(width*x2), round(height*y2))
              crop = image.crop(box).resize((tile_size, tile_size), Image.Resampling.LANCZOS).convert('RGBA')
              mask = Image.new('L', (tile_size, tile_size), 0)
              ImageDraw.Draw(mask).ellipse((2, 2, tile_size-2, tile_size-2), fill=255)
              crop.putalpha(mask)
              crop.save(output / f'{name}.webp', 'WEBP', quality=94, method=6)
              crop.save(assets / f'traveler-gender-{name}.webp', 'WEBP', quality=94, method=6)

              # A contact sheet with the common in-game medallion edge for review.
              framed = Image.new('RGBA', (tile_size+32, tile_size+32), (10, 14, 11, 255))
              draw = ImageDraw.Draw(framed)
              draw.ellipse((2, 2, tile_size+30, tile_size+30), fill=(111, 82, 45, 255), outline=(207, 175, 111, 255), width=5)
              draw.ellipse((10, 10, tile_size+22, tile_size+22), fill=(23, 38, 29, 255), outline=(62, 83, 61, 255), width=6)
              framed.alpha_composite(crop.resize((tile_size+2, tile_size+2), Image.Resampling.LANCZOS), (15, 15))
              x = 16 + (i % 2) * (tile_size + 60)
              y = 16 + (i // 2) * (tile_size + 60)
              contact.alpha_composite(framed, (x, y))
          contact.convert('RGB').save(output / 'contact-sheet.jpg', quality=92)
          print(json.dumps({'assets': [f'traveler-gender-{n}.webp' for n in names], 'crop': 'circular 512x512 WEBP'}))
          PY

      - name: Commit verified local identity assets to preview branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/ui/icons/traveler-gender-*.webp
          git commit -m "Add reviewed traveler identity emblem assets"
          git push origin HEAD:asset-preview-runway-identity

      - name: Upload identity artwork preview
        uses: actions/upload-artifact@v4
        with:
          name: runway-traveler-identity-preview
          path: /tmp/identity-preview/
          if-no-files-found: error
          retention-days: 2
