name: Playwright Tests

on:
  push:
    branches: [ main, 'refactor/**' ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      full_browser_matrix:
        description: 'Run every regression test on Chrome, Firefox, Mobile Safari, and Mobile Chrome'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 25
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check critical JavaScript syntax
        run: |
          node --check js/data.js
          node --check js/version-v090.js
          node --check js/game.js
          node --check js/systems/ashmere-controller-v099.js
          node --check js/systems/road-controller-v100.js
          node --check js/systems/audio-v100.js
          node --check js/systems/combat-v100.js
          node --check js/systems/narrative-poi-v100.js
          node --check tests/helpers/game.js
          node --check tests/legend-smoke.spec.js
          node --check tests/mobile-smoke.spec.js
          node --check tests/reboot-prototype.spec.js
          node --check tests/live-deployment.spec.js

      - name: Run Playwright tests
        env:
          FULL_BROWSER_MATRIX: ${{ inputs.full_browser_matrix && '1' || '0' }}
        run: npm run test:e2e

      - name: Smoke-test the deployed GitHub Pages build
        # The live URL must not be compared to an unmerged PR's asset URLs.
        # On pull_request runs, test the branch locally; smoke-test deployment only
        # when testing main (push or manual workflow_dispatch).
        if: github.ref == 'refs/heads/main'
        env:
          RUN_LIVE_SMOKE: '1'
        run: npx playwright test tests/live-deployment.spec.js --project="Desktop Chrome"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
