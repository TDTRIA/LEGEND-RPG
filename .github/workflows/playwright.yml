name: Playwright Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      full_browser_matrix:
        description: 'Run every regression test on Chrome, Firefox, Mobile Safari, and Mobile Chrome'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 25
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage Runway icon atlas as a local raster asset
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --silent --show-error \
            'https://dnznrvs05pmza.cloudfront.net/599635b6-376d-48ab-b7f7-e91b6292c34f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjg3NjhjNzJlZGNhMzdmNSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MzMzMTQ0Mn0.X9lxxrrkyutJLOjc6cZnCpS2p4X-jFY4DhA7JZX5OHI' \
            -o /tmp/legend-runway-icon-atlas.png
          python3 -m pip install --user pillow
          mkdir -p assets/generated/ui/icons
          python3 - <<'PY'
          from PIL import Image
          source = Image.open('/tmp/legend-runway-icon-atlas.png').convert('RGB')
          # The icon renderer needs only 128 pixels per tile; reduce the atlas to a compact local asset.
          source = source.resize((384, 384), Image.Resampling.LANCZOS)
          source.save('assets/generated/ui/icons/legend-runway-icon-atlas.webp', 'WEBP', quality=88, method=6)
          print('Prepared local atlas', source.size)
          PY

      - name: Upload staged Runway icon atlas
        uses: actions/upload-artifact@v4
        with:
          name: runway-icon-atlas-staging
          path: assets/generated/ui/icons/legend-runway-icon-atlas.webp
          retention-days: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check critical JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');

          const html = fs.readFileSync('index.html', 'utf8');
          const productionScripts = [...new Set(
            [...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/gi)]
              .map(([, src]) => src.split('?')[0])
              .filter(src => src.startsWith('js/') && src.endsWith('.js'))
          )].sort();

          function collectSpecs(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap(entry => {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) return collectSpecs(file);
              return entry.isFile() && entry.name.endsWith('.spec.js') ? [file] : [];
            });
          }

          const testSpecs = collectSpecs('tests').sort();
          if (!productionScripts.length) throw new Error('No local production JavaScript scripts were found in index.html.');
          if (!testSpecs.length) throw new Error('No Playwright .spec.js files were found under tests/.');

          function checkSyntax(file) {
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write('Syntax check failed: ' + file + '\n');
              process.stderr.write(result.stderr || result.stdout || '');
              process.exit(result.status || 1);
            }
          }

          for (const file of productionScripts) checkSyntax(file);
          for (const file of testSpecs) checkSyntax(file);
          console.log('Syntax-checked ' + productionScripts.length + ' active local production scripts and ' + testSpecs.length + ' Playwright spec files.');
          NODE
      - name: Run Playwright tests
        env:
          FULL_BROWSER_MATRIX: ${{ inputs.full_browser_matrix && '1' || '0' }}
        run: npm run test:e2e

      - name: Smoke-test the deployed GitHub Pages build
        # The live URL must not be compared to an unmerged PR's asset URLs.
        # On pull_request runs, test the branch locally; smoke-test deployment only
        # when testing main (push or manual workflow_dispatch).
        if: github.ref == 'refs/heads/main'
        env:
          RUN_LIVE_SMOKE: '1'
        run: npx playwright test tests/live-deployment.spec.js --project="Desktop Chrome"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
