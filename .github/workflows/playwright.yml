name: Playwright Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      full_regression:
        description: 'Run the complete production regression suite instead of the quick PR gate'
        required: false
        type: boolean
        default: false
      full_browser_matrix:
        description: 'Run every regression test on Chrome, Firefox, Mobile Safari, and Mobile Chrome'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache npm download data
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-ubuntu-24.04-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-npm-

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Check critical JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');

          const html = fs.readFileSync('index.html', 'utf8');
          const productionScripts = [...new Set(
            [...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/gi)]
              .map(([, src]) => src.split('?')[0])
              .filter(src => src.startsWith('js/') && src.endsWith('.js'))
          )].sort();

          function collectSpecs(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap(entry => {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) return collectSpecs(file);
              return entry.isFile() && entry.name.endsWith('.spec.js') ? [file] : [];
            });
          }

          const testSpecs = collectSpecs('tests').sort();
          if (!productionScripts.length) throw new Error('No local production JavaScript scripts were found in index.html.');
          if (!testSpecs.length) throw new Error('No Playwright .spec.js files were found under tests/.');

          function checkSyntax(file) {
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write('Syntax check failed: ' + file + '\n');
              process.stderr.write(result.stderr || result.stdout || '');
              process.exit(result.status || 1);
            }
          }

          for (const file of productionScripts) checkSyntax(file);
          for (const file of testSpecs) checkSyntax(file);
          console.log('Syntax-checked ' + productionScripts.length + ' active local production scripts and ' + testSpecs.length + ' Playwright spec files.');
          NODE
      - name: Run Playwright tests
        env:
          FULL_BROWSER_MATRIX: ${{ inputs.full_browser_matrix && '1' || '0' }}
          RUN_FULL_REGRESSION: ${{ github.event_name == 'push' || inputs.full_regression || inputs.full_browser_matrix }}
        run: |
          if [ "$RUN_FULL_REGRESSION" = "true" ]; then
            npm run test:e2e
          else
            # Keep routine PR feedback fast: cover the opening, scene-art fallback,
            # and title handoff on desktop, plus touch-critical flows on both mobiles.
            npm run test:e2e:pr
            npm run test:e2e:pr:mobile
          fi

      - name: Smoke-test the deployed GitHub Pages build
        # The live URL must not be compared to an unmerged PR's asset URLs.
        # On pull_request runs, test the branch locally; smoke-test deployment only
        # when testing main (push or manual workflow_dispatch).
        if: github.ref == 'refs/heads/main'
        env:
          RUN_LIVE_SMOKE: '1'
        run: npx playwright test tests/live-deployment.spec.js --project="Desktop Chrome"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  road-scene-parity:
    name: Phaser Road Scene Parity
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Phaser road scene source contract
        run: |
          node --check js/engine/phaser-world-v1.js
          node --check js/systems/road/road-view-v100.js
          node --check tests/ui-system-v160.spec.js
          node --check tests/legend-smoke.spec.js
          node --check tests/road-opening-v140.spec.js
          node <<'NODE'
          const fs = require('node:fs');
          const spec = fs.readFileSync('tests/ui-system-v160.spec.js', 'utf8');
          const engine = fs.readFileSync('js/engine/phaser-world-v1.js', 'utf8');
          if (!spec.includes('Phaser road background follows the live route and stage')) {
            throw new Error('The end-to-end Phaser road parity scenario is missing.');
          }
          if (!engine.includes('syncNativeRoadSceneArt') || !engine.includes('syncNativeScreenArt')) {
            throw new Error('The stage-aware/source-matched Phaser art handoff is missing.');
          }
          console.log('Phaser road scene source contract is present; behavioral parity runs in the full Playwright suite.');
          NODE
