name: Store Page Screenshot Capture

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'store-capture/**'
      - '.github/workflows/store-page-screenshots.yml'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture v0.30.4 store screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture live game screens
        run: npx playwright test --config=store-capture/playwright.config.js

      - name: Upload store page screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-page-screenshots-v0.30.4
          path: store-page-screenshots/
          if-no-files-found: error
          retention-days: 30
