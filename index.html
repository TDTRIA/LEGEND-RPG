      </div>
      <div class="legend-boot-checklist" aria-hidden="true">

        <div data-boot-step="systems"><span class="legend-boot-step-index">02</span><span class="legend-boot-step-name">World systems</span><b>WAITING</b></div>
        <div data-boot-step="traveler"><span class="legend-boot-step-index">03</span><span class="legend-boot-step-name">Traveler archive</span><b>WAITING</b></div>
        <div data-boot-step="scene"><span class="legend-boot-step-index">04</span><span class="legend-boot-step-name">Opening scene</span><b>WAITING</b></div>
      </div>
      <p class="legend-boot-footnote">INITIALIZING THE BORDERLANDS</p>
    </section>
  </div>
  <script>
    (() => {
      const screen = document.getElementById('legend-boot-screen');
      const bar = document.getElementById('legend-boot-progress');
      const fill = document.getElementById('legend-boot-progress-fill');
      const phase = document.getElementById('legend-boot-phase');
      const count = document.getElementById('legend-boot-file-count');
      const state = {
        startedAt: performance.now(),
        loadedScripts: 0,
        failedScripts: 0,
        totalScripts: 0,
        finishedAt: 0,
        checks: {}
      };
      window.__legendBootSequenceV100 = state;
      document.body.classList.add('legend-booting');

      function paintProgress(value, message, detail) {
        const bounded = Math.max(0, Math.min(100, Math.round(value)));
        if (fill) fill.style.width = bounded + '%';
        if (bar) bar.setAttribute('aria-valuenow', String(bounded));
        if (phase && message) phase.textContent = message;
        if (count && detail) count.textContent = detail;
      }
      function markStep(name, status, ready) {
        const row = document.querySelector('[data-boot-step="' + name + '"]');
        if (!row) return;
        row.classList.toggle('is-ready', Boolean(ready));
        const statusNode = row.querySelector('b');
        if (statusNode) statusNode.textContent = status;
      }
      function observeScriptEvent(event, failed) {
        const script = event.target;
        if (!script || script.tagName !== 'SCRIPT' || !script.src || script.dataset.legendBootCounted) return;
        script.dataset.legendBootCounted = '1';
        if (failed) state.failedScripts += 1;
        else state.loadedScripts += 1;
        state.totalScripts = document.querySelectorAll('script[src]').length || state.totalScripts;
        const ratio = state.loadedScripts / Math.max(1, state.totalScripts);
        const percent = Math.min(86, 6 + ratio * 80);
        let message = 'Reading the realm manifest';
        if (ratio >= .22) message = 'Linking world systems';
        if (ratio >= .52) message = 'Checking traveler records';
        if (ratio >= .82) message = 'Preparing the opening scene';
        const detail = state.failedScripts
          ? (state.loadedScripts + ' linked · ' + state.failedScripts + ' unavailable')
          : (state.loadedScripts + ' / ' + Math.max(state.totalScripts, state.loadedScripts) + ' world files linked');
        paintProgress(percent, message, detail);
      }
      document.addEventListener('load', event => observeScriptEvent(event, false), true);
      document.addEventListener('error', event => observeScriptEvent(event, true), true);

      state.paintProgress = paintProgress;
      state.markStep = markStep;
      state.reducedMotion = () => window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ||
        document.body.classList.contains('a11y-reduced-motion');
      paintProgress(4, 'Reading the realm manifest', 'Opening local world files');
    })();
  </script>
