image: atlassian/default-image:4

clone:
  depth: full

pipelines:
  branches:
    main:
      - step:
          name: Publish Bitbucket main to GitHub main
          script:
            - bash scripts/maintenance/publish-bitbucket-refs-to-github.sh main
    '**':
      - step:
          name: Mirror Bitbucket feature branch to GitHub
          script:
            - bash scripts/maintenance/publish-bitbucket-refs-to-github.sh "$BITBUCKET_BRANCH"

  custom:
    sync-all-branches-to-github:
      - step:
          name: Backfill Bitbucket branches to GitHub safely
          script:
            - bash scripts/maintenance/publish-bitbucket-refs-to-github.sh --all
